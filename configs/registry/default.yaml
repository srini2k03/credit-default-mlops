tracking_uri: ${oc.env:MLFLOW_TRACKING_URI,sqlite:///mlruns/mlflow.db}
# a path (relative to the repo root) or a URI such as s3://bucket/mlflow; read when the experiment
# is first created
artifact_location: ${oc.env:MLFLOW_ARTIFACT_LOCATION,mlruns/artifacts}
experiment: credit-default
model_name: credit-default
staging_alias: staging
production_alias: production
gate:
  pr_auc_tolerance: 0.005      # challenger may be at most this much lower (absolute)
  cost_tolerance: 0.01         # challenger cost may be at most 1% higher (relative)
