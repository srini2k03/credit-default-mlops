models: [logreg, lightgbm, xgboost]
imbalance: class_weight          # class_weight | smote | none
ablation:
  enabled: true
  strategies: [none, class_weight, smote]
  cv_folds: 3
splits:                          # stratified, seeded; fractions of all rows
  train: 0.60
  calibration: 0.10              # isotonic calibration only
  validation: 0.10               # threshold choice and model selection
  test: 0.20                     # untouched holdout; used by the quality gate
n_jobs: 2                        # explicit threads per model; -1 oversubscribes with mixed OpenMP runtimes
cv_folds: 3
n_trials: 30
timeout_s: 900                   # per model family
selection_metric: business_cost  # champion = lowest expected cost on validation
shap_sample: 1000
background_rows: 100
