[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-default-mlops"
version = "0.1.0"
description = "Credit-card default risk: validated data, tuned and calibrated models, cost-based thresholds, MLflow registry, FastAPI serving, drift monitoring."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Runtime core shared by training and serving.
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",          # evidently 0.7 is not yet compatible with pandas 3
  "scikit-learn>=1.6,<2",    # FrozenEstimator needs >= 1.6
  "imbalanced-learn>=0.13",
  "lightgbm>=4.3",
  # CPU-only build on Linux avoids the ~300 MB NCCL dependency of the default wheel.
  "xgboost-cpu>=2.1; sys_platform == 'linux'",
  "xgboost>=2.1; sys_platform != 'linux'",
  "shap>=0.46",
  "joblib>=1.4",
  "pyarrow>=16",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<0.155",   # prefect 3.x server still passes min_items= to Body()
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "mlflow-skinny>=3.1",
]
train = [
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "pandera>=0.20",
  "optuna>=4.0",
  "mlflow>=3.1",
  "matplotlib>=3.8",
  "requests>=2.32",
  "xlrd>=2.0",
  "dvc>=3.50",
]
monitor = ["evidently>=0.7,<0.8"]
orchestrate = ["prefect>=3.0"]
dev = [
  "credit-default-mlops[api,train,monitor,orchestrate]",
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
  "locust>=2.29",
  "markdown>=3.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "mlruns", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["credit_default"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [".", "tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::FutureWarning",
  "ignore::SyntaxWarning",
  "ignore::UserWarning",
]
