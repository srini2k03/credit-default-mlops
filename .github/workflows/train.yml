name: train

# Real data -> train (Optuna) -> quality gate vs the committed production model -> publish
# (results/, models/bundled/, README table) -> load test the new image -> commit.
on:
  workflow_dispatch:
    inputs:
      n_trials:
        description: Optuna trials per model family
        default: "30"
      reason:
        description: Why this run was started
        default: manual
  workflow_call:
    inputs:
      n_trials:
        type: string
        default: "30"
      reason:
        type: string
        default: called
  push:
    branches: [main]
    paths:
      - configs/**
      - dvc.lock
      - src/credit_default/data/**
      - src/credit_default/validation/**
      - src/credit_default/features/**
      - src/credit_default/models/**
      - src/credit_default/tuning/**
      - src/credit_default/threshold/**
      - src/credit_default/pipeline/train.py

permissions:
  contents: write

concurrency:
  group: train
  cancel-in-progress: false

env:
  MLFLOW_DISABLE_TELEMETRY: "true"
  MLFLOW_DISABLE_AGENT_HINT: "1"
  DO_NOT_TRACK: "1"
  MLFLOW_TRACKING_URI: sqlite:///mlruns/mlflow.db

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Restore the DVC remote (local remote persisted with actions/cache)
        uses: actions/cache@v4
        with:
          path: .dvcstore
          key: dvcstore-${{ hashFiles('dvc.lock') }}
          restore-keys: dvcstore-
      - name: Data (DVC pull, else UCI download with mirror fallback; sha256-verified; Pandera)
        run: make data
      - name: Re-create production in the empty registry from the committed bundle
        run: python -m credit_default.registry.bootstrap
      - name: Train challenger (registered as @staging)
        run: |
          echo "Reason: ${{ inputs.reason || 'push' }}"
          mkdir -p artifacts
          python -m credit_default.pipeline.train train.n_trials=${{ inputs.n_trials || '30' }} 2>&1 | tee artifacts/train.log
      - name: Quality gate (fails the job if the challenger is worse than production)
        run: python -m credit_default.registry.gate --promote
      - name: Publish results and the bundled model
        run: |
          python -m credit_default.pipeline.publish
          python scripts/update_readme_results.py
          cat results/metrics.md >> "$GITHUB_STEP_SUMMARY"
          cat results/gate.md >> "$GITHUB_STEP_SUMMARY"
      - name: Build the API image with the new model
        run: docker build -f docker/Dockerfile --target api -t credit-default-api:train .
      - name: Load test (Locust headless, 20 users, 60 s) -> results/loadtest.md
        run: |
          docker run -d --name api -p 8000:8000 credit-default-api:train
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && break; sleep 2; done
          bash scripts/smoke_api.sh http://localhost:8000
          locust -f locust/locustfile.py --headless -u 20 -r 5 -t 60s --host http://localhost:8000 \
            --csv artifacts/locust --only-summary
          python locust/summarize.py artifacts/locust_stats.csv --users 20 --duration 60s > results/loadtest.md
          cat results/loadtest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit model, results and README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results models/bundled README.md dvc.lock
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Update model and results from train run #${{ github.run_number }}" \
            -m "Trigger: ${{ inputs.reason || 'push' }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload MLflow store (used by pages.yml for screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-store
          path: mlruns
          include-hidden-files: true
          retention-days: 30
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: train-artifacts
          path: artifacts
          retention-days: 30
