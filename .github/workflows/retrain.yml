name: retrain

# Drift check -> retrain only when the monitoring policy says so (configs/monitor -> policy).
# There is no live traffic with labels, so the checked data is a simulated batch:
#   schedule: the control slice (expected outcome: no action, no retrain)
#   dispatch: choose the batch; "drifted" demonstrates the retrain path end to end,
#             "missing_values" / "new_categories" show a broken feed being blocked instead.
# A retrain trains a challenger only: it must pass the promotion gate in train.yml.
on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC
  workflow_dispatch:
    inputs:
      slice:
        description: Slice to check
        type: choice
        options: [drifted, control, missing_values, new_categories, riskier_mix]
        default: drifted

permissions:
  contents: read

env:
  MLFLOW_DISABLE_TELEMETRY: "true"
  MLFLOW_DISABLE_AGENT_HINT: "1"
  DO_NOT_TRACK: "1"

jobs:
  check-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      drift: ${{ steps.drift.outputs.drift }}
      action: ${{ steps.drift.outputs.action }}
      drift_share: ${{ steps.drift.outputs.drift_share }}
      slice: ${{ steps.drift.outputs.slice }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[train,monitor]"
      - uses: actions/cache@v4
        with:
          path: .dvcstore
          key: dvcstore-${{ hashFiles('dvc.lock') }}
          restore-keys: dvcstore-
      - run: make data
      - id: drift
        name: check_drift (0 = no action, 1 = retrain, 3 = blocked feed, 2 = error)
        run: |
          SLICE="${{ inputs.slice || 'control' }}"
          echo "slice=$SLICE" >> "$GITHUB_OUTPUT"
          set +e
          python -m credit_default.monitor.check_drift --slice="$SLICE"
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then exit 2; fi
          python - "$SLICE" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          s = json.load(open(f"reports/check_{sys.argv[1]}.json"))
          d = s["decision"]
          print(f"**{sys.argv[1]}** -> **{d['action']}**: " + ("; ".join(d["reasons"]) or "nothing moved"))
          print(f"\nFeature drift share {s['feature_drift_share']:.2f}, prediction PSI {s['prediction_psi']:.3f}")
          PY
          if [ "$rc" -eq 3 ]; then echo "::warning::Batch blocked by data-quality checks; no retraining on a broken feed"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: reports
          retention-days: 30

  retrain:
    needs: check-drift
    if: needs.check-drift.outputs.drift == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/train.yml
    with:
      n_trials: "30"
      reason: "monitoring policy: retrain on the ${{ needs.check-drift.outputs.slice }} batch (feature drift share ${{ needs.check-drift.outputs.drift_share }})"
    secrets: inherit
