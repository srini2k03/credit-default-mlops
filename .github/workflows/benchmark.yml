name: benchmark

# Latency, throughput and memory of the committed production model and the API on a
# GitHub-hosted runner (4 vCPU): in-process pipeline vs fast path (identical outputs
# asserted), model-loading strategies, and HTTP under 1-32 concurrent clients.
# Results are committed to results/benchmarks/.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [train]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: benchmark
  cancel-in-progress: false

env:
  MLFLOW_DISABLE_TELEMETRY: "true"
  MLFLOW_DISABLE_AGENT_HINT: "1"
  DO_NOT_TRACK: "1"

jobs:
  benchmark:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - uses: actions/cache@v4
        with:
          path: .dvcstore
          key: dvcstore-${{ hashFiles('dvc.lock') }}
          restore-keys: dvcstore-
      - name: Real data
        run: make data
      - name: Benchmark (fails if the fast path is not bit-identical)
        env:
          BENCH_MACHINE: "GitHub-hosted ubuntu runner"
        run: |
          python -m credit_default.perf.benchmark
          cat results/benchmarks/benchmark.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/benchmarks
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Update serving benchmark (run #${{ github.run_number }})" \
            -m "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          exit 1
