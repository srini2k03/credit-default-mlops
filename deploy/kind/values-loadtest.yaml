# Overrides for the kind load test (scripts/k8s/run_loadtest.sh).
image:
  repository: credit-default-api
  tag: kind
  pullPolicy: Never   # loaded with `kind load docker-image`

service:
  type: NodePort
  nodePort: 30080

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    # Shorter than the 300 s default so the scale-down is visible within the cool-down phase.
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
